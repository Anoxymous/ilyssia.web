<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Timeline</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f0e6;
    margin: 0;
    padding: 20px;
  }

  h1 { margin-bottom: 10px; }

  #timeline-container {
    display: flex;
    gap: 20px;
  }

  #timeline {
    border-collapse: collapse;
    background: #fdfaf5;
    border: 1px solid #d0c4aa;
    font-size: 13px;
  }

  #timeline th, #timeline td {
    border: 1px solid #d0c4aa;
    padding: 4px 6px;
    text-align: center;
  }

  #timeline th.category-header {
    background: #e0d4bd;
    font-weight: bold;
  }

  #timeline td.time-cell {
    background: #e6ddc7;
    font-weight: bold;
    width: 60px;
  }

  .event-slot {
    cursor: pointer;
    border-radius: 3px;
    padding: 4px;
  }

  .event-slot:hover {
    outline: 2px solid #1f2933;
  }

  #details {
    flex: 0 0 260px;
    border: 1px solid #d0c4aa;
    background: #fdfaf5;
    padding: 10px;

    /* NEW — makes the panel scroll with the page */
    position: sticky;
    top: 20px;
    height: fit-content;
  }

  #details h2 { margin-top: 0; }
  .field-label { font-weight: bold; }
</style>
</head>
<body>

<h1>Wedding Timeline</h1>
<div id="filters"></div>
<div id="timeline-container">
  <table id="timeline"></table>

  <div id="details">
    <h2>Selected Item</h2>
    <p><span class="field-label">Time:</span> <span id="detail-time">–</span></p>
    <p><span class="field-label">Category:</span> <span id="detail-category">–</span></p>
    <p><span class="field-label">Title:</span> <span id="detail-title">–</span></p>
    <p><span class="field-label">Who:</span></p><p  id="detail-who">–</p>
    <p><span class="field-label">Notes:</span></p><p id="detail-notes">–</p>
  </div>
</div>

<script src="timelinedata.js"></script>
<script src="timeline.js"></script>

</body>
</html>
